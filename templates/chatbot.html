{% extends "base.html" %}
{% block title %}Chatbot • AI Tutor{% endblock %}

{% block head %}
<style>
  .main{max-width:100% !important; padding:0 !important}
  .chat-shell{display:grid;grid-template-columns:300px 1fr;gap:0;height:100vh}
  
  /* Chat list sidebar */
  .chat-sidebar{
    background:#fff;
    border-right:1px solid var(--border);
    padding:20px;
    overflow-y:auto;
  }
  .chat-sidebar-head{
    margin-bottom:20px;
  }
  .conv-list{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .conv-item{
    padding:14px 16px;
    border:1px solid var(--border);
    border-radius:10px;
    cursor:pointer;
    transition:all 0.2s;
  }
  .conv-item:hover{
    background:#f9fafb;
  }
  .conv-item.active{
    background:#f3f4f6;
    border-color:#9ca3af;
  }
  .conv-name{
    font-weight:600;
    font-size:15px;
    color:var(--text);
  }
  .conv-meta{
    color:var(--muted);
    font-size:12px;
    margin-top:4px;
  }
  
  /* Main chat area */
  .chat-panel{
    display:flex;
    flex-direction:column;
    background:#fff;
  }
  
  /* Header with title and buttons */
  .chat-header{
    padding:20px 24px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .chat-title{
    font-size:24px;
    font-weight:700;
    color:var(--text);
  }
  .chat-header-actions{
    display:flex;
    gap:12px;
  }
  .btn.header-btn{
    padding:10px 20px;
    font-size:14px;
    font-weight:600;
    border-radius:8px;
  }
  
  /* Chat messages area */
  .chat-box{
    flex:1;
    overflow-y:auto;
    padding:24px;
    background:#fafafa;
  }
  .msg-row{
    display:flex;
    margin-bottom:16px;
    gap:12px;
  }
  .msg-row.user-msg{
    justify-content:flex-end;
  }
  .bubble{
    max-width:65%;
    padding:12px 16px;
    border-radius:16px;
    white-space:pre-wrap;
    word-wrap:break-word;
  }
  .bubble.assistant{
    background:#fff;
    border:1px solid var(--border);
    align-self:flex-start;
  }
  .bubble.user{
    background:#e0e7ff;
    border:1px solid #c7d2fe;
    align-self:flex-end;
  }
  
  /* Input area */
  .chat-input-wrapper{
    padding:20px 24px;
    border-top:1px solid var(--border);
    background:#fff;
  }
  form.chat-input{
    display:flex;
    gap:12px;
    align-items:flex-end;
  }
  form.chat-input textarea{
    flex:1;
    padding:12px 16px;
    border:1px solid var(--border);
    border-radius:12px;
    min-height:50px;
    max-height:150px;
    resize:vertical;
    font-size:15px;
  }
  form.chat-input button{
    padding:12px 24px;
    font-size:15px;
    font-weight:600;
    border-radius:10px;
  }
  
  /* Options toolbar */
  .chat-options{
    display:flex;
    gap:16px;
    margin-bottom:12px;
    font-size:14px;
  }
  .chat-options label{
    display:flex;
    align-items:center;
    gap:6px;
    color:var(--muted);
    cursor:pointer;
  }
  
  @media (max-width: 820px){
    .chat-shell{
      grid-template-columns:1fr;
    }
    .chat-sidebar{
      display:none;
    }
  }
</style>
{% endblock %}

{% block content %}
<div class="chat-shell">
  <!-- Chat List Sidebar -->
  <aside class="chat-sidebar">
    <div class="chat-sidebar-head">
      <button class="btn primary" id="newChatBtn" style="width:100%">+ New Chat</button>
    </div>
    <ul class="conv-list" id="convList"></ul>
  </aside>

  <!-- Main Chat Panel -->
  <section class="chat-panel">
    <!-- Header -->
    <div class="chat-header">
      <h1 class="chat-title">Chat with AI Tutor</h1>
      <div class="chat-header-actions">
        <button class="btn header-btn" id="renameBtn">Rename chat</button>
        <button class="btn header-btn" id="saveBtn">Save chat</button>
      </div>
    </div>

    <!-- Messages -->
    <div id="chatBox" class="chat-box" aria-live="polite"></div>

    <!-- Input Area -->
    <div class="chat-input-wrapper">
      <div class="chat-options">
        <label><input type="checkbox" id="stream" checked> Stream</label>
        <label><input type="checkbox" id="fast" checked> Fast mode</label>
      </div>
      <form class="chat-input" id="chatForm">
        <textarea id="msg" placeholder="Type your message....."></textarea>
        <button class="btn primary" type="submit" id="sendBtn">Send</button>
      </form>
    </div>
  </section>
</div>
{% endblock %}

{% block scripts %}
<script>
(() => {
  const chatBox     = document.getElementById('chatBox');
  const form        = document.getElementById('chatForm');
  const msgEl       = document.getElementById('msg');
  const sendBtn     = document.getElementById('sendBtn');
  const streamEl    = document.getElementById('stream');
  const fastEl      = document.getElementById('fast');

  const convListEl  = document.getElementById('convList');
  const convCountEl = document.getElementById('convCount');
  const newChatBtn  = document.getElementById('newChatBtn');
  const renameBtn   = document.getElementById('renameBtn');
  const deleteBtn   = document.getElementById('deleteBtn');
  const saveBtn     = document.getElementById('saveBtn');

  let convos = [];
  let currentCid = null;
  let busy = false;

  // ---------- API helpers (ALL under /chatbot) ----------
  const api = {
    // list & create
    list:   () => fetch('/chatbot/convos').then(r => r.json()),
    create: (title='New chat') =>
      fetch('/chatbot/convos', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({title})
      }).then(r => r.json()),

    // get / update / delete ONE convo  (NOTE: plural /convos/)
    get:   (cid) => fetch(`/chatbot/convos/${cid}`).then(r => r.ok ? r.json() : Promise.reject()),
    patch: (cid, data) =>
      fetch(`/chatbot/convos/${cid}`, {
        method:'PATCH', headers:{'Content-Type':'application/json'},
        body:JSON.stringify(data || {})
      }).then(r => r.json()),
    del:   (cid) => fetch(`/chatbot/convos/${cid}`, { method:'DELETE' }),

    // talk to the model (singular /conv/)
    send:   (cid, payload) =>
      fetch(`/chatbot/conv/${cid}/send`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify(payload)
      }).then(r => r.json()),
    stream: (cid, payload) =>
      fetch(`/chatbot/conv/${cid}/stream`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify(payload)
      }),
  };

  // ---------- Conversations ----------
  async function loadConvos(selectLatest = true) {
    try {
      convos = await api.list();
      renderConvList();

      // Create one automatically if empty
      if (!convos.length) {
        const c = await api.create('New chat');
        currentCid = c.id;
        await renderOpen(currentCid);
        return;
      }

      // Open newest if none selected yet
      if (selectLatest && !currentCid) {
        const latest = [...convos].sort((a,b)=>(b.updated_at||'').localeCompare(a.updated_at||''))[0];
        if (latest) {
          currentCid = latest.id;
          await renderOpen(currentCid);
        }
      }
    } catch (e) {
      console.error(e);
    }
  }

  function renderConvList() {
    convListEl.innerHTML = '';
    [...convos]
      .sort((a,b)=>(b.updated_at||'').localeCompare(a.updated_at||''))
      .forEach(c => {
        const li = document.createElement('li');
        li.className = 'conv-item' + (c.id === currentCid ? ' active' : '');

        const name = document.createElement('div');
        name.className = 'conv-name';
        name.textContent = c.title || 'Chat';
        
        const meta = document.createElement('div');
        meta.className = 'conv-meta';
        const date = new Date(c.updated_at || c.created_at);
        meta.textContent = date.toLocaleDateString();

        li.append(name, meta);
        li.onclick = () => openConvo(c.id);
        convListEl.appendChild(li);
      });
  }

  async function renderOpen(cid) {
    try {
      const convo = await api.get(cid);
      currentCid = convo.id;
      renderConvList();
      chatBox.innerHTML = '';
      (convo.messages || []).forEach(m => addBubble(m.role, m.content || ''));
      chatBox.scrollTop = chatBox.scrollHeight;
    } catch {
      alert('Could not open chat');
    }
  }

  async function openConvo(cid) { await renderOpen(cid); }

  async function newChat() {
    const c = await api.create('New chat');
    currentCid = c.id;
    await loadConvos(false);
    await renderOpen(currentCid);
  }

  async function renameChat() {
    if (!currentCid) return;
    const cur = convos.find(x => x.id === currentCid);
    const name = prompt('New title:', (cur && cur.title) || 'Chat');
    if (!name) return;
    await api.patch(currentCid, { title: name });
    await loadConvos(false);
  }

  async function deleteChat() {
    if (!currentCid) return;
    if (!confirm('Delete this chat?')) return;
    await api.del(currentCid);
    currentCid = null;
    await loadConvos(true);
  }

  newChatBtn.onclick = newChat;
  renameBtn.onclick  = renameChat;
  saveBtn.onclick    = () => alert('Chats auto-save after every message.');

  // ---------- Chat ----------
  function addBubble(role, text) {
    const row = document.createElement('div');
    row.className = 'msg-row' + (role === 'user' ? ' user-msg' : '');
    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + (role === 'user' ? 'user' : 'assistant');
    bubble.textContent = text || '';
    row.appendChild(bubble);
    chatBox.appendChild(row);
  }

  async function ensureChat() {
    if (currentCid) return currentCid;
    const c = await api.create('New chat'); // auto-create on first send
    currentCid = c.id;
    await loadConvos(false);
    return currentCid;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (busy) return;

    const text = (msgEl.value || '').trim();
    if (!text) return;

    busy = true; sendBtn.disabled = true;

    try {
      const cid = await ensureChat();
      addBubble('user', text);
      chatBox.scrollTop = chatBox.scrollHeight;
      msgEl.value = '';

      if (streamEl.checked) {
        const r = await api.stream(cid, { message: text, fast: !!fastEl.checked });
        const reader  = r.body.getReader();
        const decoder = new TextDecoder();

        let acc = '';
        const row = document.createElement('div'); 
        row.className = 'msg-row';
        const bubble = document.createElement('div'); 
        bubble.className = 'bubble assistant';
        row.appendChild(bubble); chatBox.appendChild(row);

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          acc += decoder.decode(value, { stream: true });
          bubble.textContent = acc;
          chatBox.scrollTop = chatBox.scrollHeight;
        }
      } else {
        const j = await api.send(cid, { message: text, fast: !!fastEl.checked });
        addBubble('assistant', j.reply || '(no reply)');
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      await loadConvos(false); // refresh sidebar after each turn
    } catch (err) {
      console.error(err);
      addBubble('assistant', `[error] ${err && err.message ? err.message : err}`);
    } finally {
      busy = false; sendBtn.disabled = false;
    }
  });

  // Shift+Enter newline; Enter to send
  msgEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  // Initial load
  loadConvos(true);
})();
</script>
{% endblock %}
