{% extends 'base.html' %}

{% block head %}
<style>
  .main{max-width:100% !important; padding:0 !important}
  .chat-shell{display:grid;grid-template-columns:300px 1fr;gap:0;height:100vh;overflow:hidden}
  
  /* Chat list sidebar */
  .chat-sidebar{
    background:#fff;
    border-right:1px solid var(--border);
    padding:20px;
    overflow-y:auto;
    height:100%;
  }
  .chat-sidebar-head{
    margin-bottom:20px;
  }
  .conv-list{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .conv-item{
    padding:14px 16px;
    border:1px solid var(--border);
    border-radius:10px;
    cursor:pointer;
    transition:all 0.2s;
  }
  .conv-item:hover{
    background:#f9fafb;
  }
  .conv-item.active{
    background:#f3f4f6;
    border-color:#9ca3af;
  }
  .conv-name{
    font-weight:600;
    font-size:15px;
    color:var(--text);
  }
  .conv-meta{
    color:var(--muted);
    font-size:12px;
    margin-top:4px;
  }
  
  /* Main chat area */
  .chat-panel{
    display:flex;
    flex-direction:column;
    background:#fff;
    height:100%;
    overflow:hidden;
  }
  
  /* Header with title and buttons */
  .chat-header{
    padding:20px 24px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .chat-title{
    font-size:24px;
    font-weight:700;
    color:var(--text);
    margin:0;
  }
  .chat-header-actions{
    display:flex;
    gap:12px;
  }
  .btn.header-btn{
    padding:10px 20px;
    font-size:14px;
    font-weight:600;
    border-radius:8px;
  }
  .btn.delete-btn{
    background:#fee2e2;
    color:#991b1b;
    border-color:#fecaca;
  }
  .btn.delete-btn:hover{
    background:#fecaca;
  }
  
  /* Chat messages area */
  .chat-box{
    flex:1;
    overflow-y:auto;
    padding:24px;
    background:#fafafa;
  }
  .msg-row{
    display:flex;
    margin-bottom:16px;
    gap:12px;
  }
  .msg-row.user-msg{
    justify-content:flex-end;
  }
  .bubble{
    max-width:65%;
    padding:12px 16px;
    border-radius:16px;
    white-space:pre-wrap;
    word-wrap:break-word;
  }
  .bubble.assistant{
    background:#fff;
    border:1px solid var(--border);
    align-self:flex-start;
  }
  .bubble.user{
    background:#e0e7ff;
    border:1px solid #c7d2fe;
    align-self:flex-end;
  }
  
  /* Input area */
  .chat-input-wrapper{
    padding:20px 24px;
    border-top:1px solid var(--border);
    background:#fff;
  }
  form.chat-input{
    display:flex;
    gap:12px;
    align-items:flex-end;
  }
  form.chat-input textarea{
    flex:1;
    padding:12px 16px;
    border:1px solid var(--border);
    border-radius:12px;
    min-height:50px;
    max-height:150px;
    resize:vertical;
    font-size:15px;
  }
  form.chat-input button{
    padding:12px 24px;
    font-size:15px;
    font-weight:600;
    border-radius:10px;
  }
  
  /* Rename input in sidebar */
  .rename-wrapper{
    display:flex;
    gap:8px;
    margin-bottom:16px;
  }
  .rename-wrapper input{
    flex:1;
    padding:8px 12px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:14px;
  }
  .rename-wrapper button{
    padding:8px 16px;
    font-size:13px;
    border-radius:8px;
  }
  
  /* Streaming toggle */
  .streaming-toggle{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:12px;
    font-size:14px;
    color:var(--muted);
  }
  .streaming-toggle input[type="checkbox"]{
    width:auto;
    cursor:pointer;
  }
  
  @media (max-width: 820px){
    .chat-shell{
      grid-template-columns:1fr;
    }
    .chat-sidebar{
      display:none;
    }
  }
</style>
{% endblock %}

{% block content %}
<div class="chat-shell">
  <!-- Chat List Sidebar -->
  <aside class="chat-sidebar">
    <div class="chat-sidebar-head">
      <button class="btn primary" id="new-chat-btn" style="width:100%">+ New Chat</button>
    </div>
    <div class="rename-wrapper">
      <input id="chat-session-rename" placeholder="Rename chat…" />
      <button id="rename-btn" class="btn" type="button">Rename</button>
    </div>
    <ul class="conv-list" id="session-list"></ul>
  </aside>

  <!-- Main Chat Panel -->
  <section class="chat-panel">
    <!-- Header -->
    <div class="chat-header">
      <h1 class="chat-title">Chat with AI Tutor</h1>
      <div class="chat-header-actions">
        <select id="chat-session-select" style="padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;"></select>
        <button class="btn header-btn delete-btn" id="delete-btn" title="Delete chat">Delete</button>
      </div>
    </div>

    <!-- Messages -->
    <div id="chat-box" class="chat-box"></div>

    <!-- Input Area -->
    <div class="chat-input-wrapper">
      <div class="streaming-toggle">
        <input type="checkbox" id="streaming-toggle" checked>
        <label for="streaming-toggle">Enable streaming responses</label>
      </div>
      <form class="chat-input" id="chat-form">
        <textarea id="user-input" placeholder="Type your message....."></textarea>
        <button class="btn primary" type="submit" id="send-btn">Send</button>
      </form>
    </div>
  </section>
</div>

<script>
(() => {
  const form   = document.getElementById('chat-form');
  const input  = document.getElementById('user-input');
  const chatBox = document.getElementById('chat-box');
  const sendBtn= document.getElementById('send-btn');
  const sessionSelect = document.getElementById('chat-session-select');
  const sessionList = document.getElementById('session-list');
  const renameInput = document.getElementById('chat-session-rename');
  const renameBtn = document.getElementById('rename-btn');
  const newChatBtn = document.getElementById('new-chat-btn');
  const deleteBtn = document.getElementById('delete-btn');
  const streamingToggle = document.getElementById('streaming-toggle');

  const HISTORY_LIMIT = 12;
  let history = [];
  let chatId = null;
  let chatName = '';
  let sessions = [];

  function addBubble(role, text) {
    const row = document.createElement('div');
    row.className = 'msg-row' + (role === 'user' ? ' user-msg' : '');
    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + (role === 'user' ? 'user' : 'assistant');
    bubble.textContent = text || '';
    row.appendChild(bubble);
    chatBox.appendChild(row);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function renderHistory() {
    chatBox.innerHTML = '';
    for (const msg of history) {
      addBubble(msg.role, msg.content);
    }
  }

  function renderSessionList() {
    sessionList.innerHTML = '';
    [...sessions].forEach(s => {
      const li = document.createElement('li');
      li.className = 'conv-item' + (s.id === chatId ? ' active' : '');
      
      const name = document.createElement('div');
      name.className = 'conv-name';
      name.textContent = s.name || 'Chat';
      
      const meta = document.createElement('div');
      meta.className = 'conv-meta';
      meta.textContent = s.id;
      
      li.append(name, meta);
      li.onclick = () => loadSession(s.id);
      sessionList.appendChild(li);
    });
  }

  async function sendMessage(text, useStreaming = false) {
    const trimmed = history.slice(-HISTORY_LIMIT);
    console.log('[DEBUG] Sending message:', { text, historyLength: trimmed.length, chat_id: chatId, chat_name: chatName, streaming: useStreaming });
    
    if (useStreaming) {
      return await sendMessageStreaming(text, trimmed);
    }
    
    const res = await fetch('/chatbot/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, history: trimmed, chat_id: chatId, chat_name: chatName })
    });
    console.log('[DEBUG] Response status:', res.status);
    if (!res.ok) {
      const errorText = await res.text();
      console.error('[ERROR] Response error:', errorText);
      throw new Error(`HTTP ${res.status} — ${errorText}`);
    }
    const data = await res.json();
    console.log('[DEBUG] Response data:', data);
    if (!data.ok) {
      throw new Error(data.error || 'Unknown error from server');
    }
    if (data.chat_id) chatId = data.chat_id;
    if (data.chat_name) chatName = data.chat_name;
    return data.reply;
  }

  async function sendMessageStreaming(text, trimmed) {
    const res = await fetch('/chatbot/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, history: trimmed, chat_id: chatId, chat_name: chatName })
    });
    
    if (!res.ok) {
      const errorText = await res.text();
      throw new Error(`HTTP ${res.status} — ${errorText}`);
    }
    
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let fullResponse = '';
    
    // Create streaming bubble
    const row = document.createElement('div');
    row.className = 'msg-row';
    const bubble = document.createElement('div');
    bubble.className = 'bubble assistant';
    row.appendChild(bubble);
    chatBox.appendChild(row);
    
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      
      const chunk = decoder.decode(value, { stream: true });
      fullResponse += chunk;
      bubble.textContent = fullResponse;
      chatBox.scrollTop = chatBox.scrollHeight;
    }
    
    return fullResponse;
  }

  async function fetchSessions() {
    try {
      const res = await fetch('/chatbot/sessions');
      if (!res.ok) return [];
      return await res.json();
    } catch (err) {
      console.error('[ERROR] fetchSessions:', err);
      return [];
    }
  }

  async function loadSession(id) {
    const res = await fetch(`/chatbot/session/${id}`);
    if (!res.ok) return { name: id, messages: [] };
    const session = await res.json();
    chatId = id;
    chatName = session.name;
    history = session.messages || [];
    renameInput.value = chatName;
    renderHistory();
    renderSessionList();
    renderSessionDropdown();
  }

  async function renameSession(id, newName) {
    const res = await fetch(`/chatbot/session/${id}/rename`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ new_name: newName })
    });
    return res.ok;
  }

  async function deleteSession(id) {
    const res = await fetch(`/chatbot/session/${id}/delete`, {
      method: 'DELETE'
    });
    return res.ok;
  }

  async function refreshSessions() {
    sessions = await fetchSessions();
    renderSessionList();
    renderSessionDropdown();
  }

  function renderSessionDropdown() {
    sessionSelect.innerHTML = '';
    const newOpt = document.createElement('option');
    newOpt.value = '';
    newOpt.textContent = 'New Chat';
    sessionSelect.appendChild(newOpt);
    
    sessions.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.id;
      opt.textContent = s.name;
      sessionSelect.appendChild(opt);
    });
    
    if (chatId) {
      sessionSelect.value = chatId;
    } else {
      sessionSelect.value = '';
    }
  }

  sessionSelect.addEventListener('change', async () => {
    const id = sessionSelect.value;
    if (!id) {
      chatId = null;
      chatName = '';
      history = [];
      renameInput.value = '';
      chatBox.innerHTML = '';
      renderSessionList();
    } else {
      await loadSession(id);
    }
  });

  newChatBtn.addEventListener('click', () => {
    chatId = null;
    chatName = '';
    history = [];
    renameInput.value = '';
    chatBox.innerHTML = '';
    sessionSelect.value = '';
    renderSessionList();
    input.focus();
  });

  renameBtn.addEventListener('click', async () => {
    const newName = renameInput.value.trim();
    if (!chatId || !newName) return;
    const ok = await renameSession(chatId, newName);
    if (ok) {
      chatName = newName;
      await refreshSessions();
    }
  });

  deleteBtn.addEventListener('click', async () => {
    if (!chatId) {
      alert('No chat selected to delete.');
      return;
    }
    if (!confirm('Are you sure you want to delete this chat? This cannot be undone.')) {
      return;
    }
    const ok = await deleteSession(chatId);
    if (ok) {
      chatId = null;
      chatName = '';
      history = [];
      renameInput.value = '';
      chatBox.innerHTML = '';
      await refreshSessions();
      sessionSelect.value = '';
    } else {
      alert('Failed to delete chat.');
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = (input.value || '').trim();
    if (!text) return;
    sendBtn.disabled = true;
    addBubble('user', text);
    console.log('[DEBUG] Form submitted with text:', text);
    
    const useStreaming = streamingToggle.checked;
    
    try {
      const reply = await sendMessage(text, useStreaming);
      console.log('[DEBUG] Got reply:', reply);
      history.push({ role: 'user',      content: text  });
      history.push({ role: 'assistant', content: reply });
      
      // Only add bubble if not streaming (streaming creates its own)
      if (!useStreaming) {
        addBubble('assistant', reply);
      }
      
      input.value = '';
      await refreshSessions();
    } catch (err) {
      console.error('[ERROR] Failed to send message:', err);
      addBubble('assistant', `Sorry — Error: ${err.message || 'Could not reach the model'}`);
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.dispatchEvent(new Event('submit', { cancelable: true }));
    }
  });

  // Initial load
  (async () => {
    await refreshSessions();
    sessionSelect.value = '';
  })();
})();
</script>
{% endblock %}
