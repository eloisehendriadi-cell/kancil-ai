{% extends "base.html" %}

{% block head %}
<style>
  /* Override base layout for homepage */
  .layout{display:block}
  .sidebar{display:none}
  .main{max-width:100% !important;padding:0 !important;min-height:100vh;display:flex;align-items:center;justify-content:center}
  
  body{
    background:linear-gradient(135deg, #f6f7fb 0%, #e9ecf5 100%);
    overflow:hidden;
  }
  
  .hero-container{
    text-align:center;
    position:relative;
    z-index:10;
    padding:40px 20px;
  }
  
  /* Logo */
  .logo-section{
    margin-bottom:60px;
    animation:fadeInDown 0.8s ease-out;
  }
  .logo-circle{
    width:180px;
    height:180px;
    margin:0 auto 30px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .logo-img{
    width:100%;
    height:100%;
    object-fit:contain;
  }
  .brand-title{
    font-size:72px;
    font-weight:700;
    color:#6b7280;
    letter-spacing:-2px;
    margin:0 0 10px;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,sans-serif;
  }
  .brand-subtitle{
    font-size:24px;
    color:#9ca3af;
    font-weight:400;
    margin:0;
  }
  
  /* Welcome section */
  .welcome-section{
    margin:80px 0 50px;
    animation:fadeInUp 0.8s ease-out 0.2s backwards;
  }
  .welcome-text{
    font-size:64px;
    font-weight:300;
    color:#374151;
    margin:0 0 40px;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,sans-serif;
    letter-spacing:-1px;
  }
  .start-btn{
    display:inline-block;
    padding:20px 60px;
    font-size:24px;
    font-weight:600;
    background:#6b7280;
    color:#fff;
    border:none;
    border-radius:16px;
    cursor:pointer;
    text-decoration:none;
    box-shadow:0 10px 30px rgba(107,114,128,0.3);
    transition:all 0.3s ease;
  }
  .start-btn:hover{
    background:#4b5563;
    transform:translateY(-2px);
    box-shadow:0 15px 40px rgba(107,114,128,0.4);
  }
  
  /* Decorative elements */
  .decor-elements{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:1;
    overflow:hidden;
  }
  .decor-square{
    position:absolute;
    border:3px solid rgba(107,114,128,0.15);
    border-radius:8px;
    animation:float 20s infinite ease-in-out;
  }
  .decor-square:nth-child(1){
    width:120px;
    height:120px;
    top:10%;
    right:15%;
    transform:rotate(15deg);
    animation-delay:0s;
  }
  .decor-square:nth-child(2){
    width:80px;
    height:80px;
    top:20%;
    right:8%;
    transform:rotate(-25deg);
    animation-delay:2s;
  }
  .decor-square:nth-child(3){
    width:100px;
    height:100px;
    top:15%;
    right:25%;
    transform:rotate(45deg);
    animation-delay:4s;
    opacity:0.5;
  }
  .decor-square:nth-child(4){
    width:90px;
    height:90px;
    bottom:15%;
    left:12%;
    transform:rotate(-15deg);
    animation-delay:1s;
  }
  .decor-square:nth-child(5){
    width:110px;
    height:110px;
    bottom:20%;
    left:20%;
    transform:rotate(30deg);
    animation-delay:3s;
  }
  .decor-square:nth-child(6){
    width:70px;
    height:70px;
    bottom:10%;
    left:8%;
    transform:rotate(-40deg);
    animation-delay:5s;
    opacity:0.6;
  }
  .decor-square:nth-child(7){
    width:95px;
    height:95px;
    top:50%;
    right:5%;
    transform:rotate(20deg);
    animation-delay:2.5s;
    opacity:0.4;
  }
  .decor-square:nth-child(8){
    width:85px;
    height:85px;
    top:60%;
    left:10%;
    transform:rotate(-35deg);
    animation-delay:4.5s;
    opacity:0.5;
  }
  
  @keyframes float{
    0%, 100%{
      transform:translateY(0) rotate(var(--rotation));
    }
    25%{
      transform:translateY(-20px) rotate(calc(var(--rotation) + 5deg));
    }
    50%{
      transform:translateY(-40px) rotate(var(--rotation));
    }
    75%{
      transform:translateY(-20px) rotate(calc(var(--rotation) - 5deg));
    }
  }
  
  @keyframes fadeInDown{
    from{
      opacity:0;
      transform:translateY(-30px);
    }
    to{
      opacity:1;
      transform:translateY(0);
    }
  }
  
  @keyframes fadeInUp{
    from{
      opacity:0;
      transform:translateY(30px);
    }
    to{
      opacity:1;
      transform:translateY(0);
    }
  }
  
  @media (max-width: 768px){
    .brand-title{font-size:48px}
    .brand-subtitle{font-size:18px}
    .welcome-text{font-size:42px}
    .start-btn{padding:16px 40px;font-size:20px}
    .logo-circle{width:140px;height:140px}
    .decor-square{display:none}
  }
</style>
{% endblock %}

{% block content %}
<!-- Decorative floating squares -->
<div class="decor-elements">
  <div class="decor-square" style="--rotation:15deg"></div>
  <div class="decor-square" style="--rotation:-25deg"></div>
  <div class="decor-square" style="--rotation:45deg"></div>
  <div class="decor-square" style="--rotation:-15deg"></div>
  <div class="decor-square" style="--rotation:30deg"></div>
  <div class="decor-square" style="--rotation:-40deg"></div>
  <div class="decor-square" style="--rotation:20deg"></div>
  <div class="decor-square" style="--rotation:-35deg"></div>
</div>

<div class="hero-container">
  <!-- Logo Section -->
  <div class="logo-section">
    <div class="logo-circle">
      <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Kancil AI Logo" class="logo-img">
    </div>
    <h1 class="brand-title">Kancil AI</h1>
    <p class="brand-subtitle">-Smart learning for all</p>
  </div>
  
  <!-- Welcome Section -->
  <div class="welcome-section">
    <h2 class="welcome-text">Welcome</h2>
    <a href="{{ url_for('dashboard') }}" class="start-btn">Start now</a>
  </div>
</div>
{% endblock %}
